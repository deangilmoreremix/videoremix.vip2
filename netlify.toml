[build]
  # The release gate IS the CI/CD: GitHub Actions are NOT used and MUST NOT gate
  # deploys. Any non-zero exit from the gate fails the Netlify deploy.
  # Gate steps (fail-fast): validate-env → lint → full vitest suite → catalog
  # integrity suite → webhook security suites → tsc regression check → vite build.
  command = "npm run release:gate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"
  # Defensive: guarantees devDependencies (eslint/vitest/typescript/vite — the
  # gate toolchain) install even if NODE_ENV=production is ever set at the site
  # level. NODE_ENV is deliberately NOT set here: vite build already defaults to
  # production mode, and Netlify's build image does not set NODE_ENV by default.
  NPM_FLAGS = "--include=dev"

# ---------------------------------------------------------------------------
# Deploy context environment — NON-SECRET markers only.
# SECRETS ARE NEVER COMMITTED HERE. Set them in the Netlify UI per context
# (Site configuration → Build & deploy → Environment variables → scoped by
# "Same value for all contexts" / "Different value for each deploy context"):
#   All contexts:   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY  (public values,
#                   required by validate-env at build time)
#   Production:     VITE_CLERK_PUBLISHABLE_KEY (prod), VITE_REQUEST_SIGNING_SECRET
#                   or other server-only secrets — see docs/completion/netlify-cicd-implementation.md
#   Deploy Preview: preview/test keys as needed
# ---------------------------------------------------------------------------

[context.production.environment]
  VITE_APP_ENV = "production"

[context.deploy-preview.environment]
  VITE_APP_ENV = "preview"

[context.branch-deploy.environment]
  VITE_APP_ENV = "staging"


# Personalization API endpoints - route to Netlify Functions
[[redirects]]
  from = "/api/personalizer/scan"
  to = "/.netlify/functions/personalization-scan-prospect"
  status = 200

[[redirects]]
  from = "/api/personalizer/generate"
  to = "/.netlify/functions/personalization-generate-personalization"
  status = 200

[[redirects]]
  from = "/api/personalizer/save"
  to = "/.netlify/functions/personalization-save-results"
  status = 200

[[redirects]]
  from = "/api/personalizer/media"
  to = "/.netlify/functions/personalization-generate-media"
  status = 200

[[redirects]]
  from = "/api/personalizer/job/create"
  to = "/.netlify/functions/personalization-scan-job-create"
  status = 200

[[redirects]]
  from = "/api/personalizer/job/:jobId/status"
  to = "/.netlify/functions/personalization-scan-job-status"
  status = 200

[[redirects]]
  from = "/auth/*"
  to = "https://bzxohkrxcwodllketcpz.supabase.co/auth/:splat"
  status = 200

# General API catch-all (after specific routes)
[[redirects]]
  from = "/api/*"
  to = "https://bzxohkrxcwodllketcpz.supabase.co/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.clerk.accounts.dev https://clerk.accounts.dev https://clerk.auth.videoremix.vip https://challenges.cloudflare.com https://*.cloudflare.com; worker-src blob:; style-src 'self' 'unsafe-inline' https://*.clerk.accounts.dev https://clerk.accounts.dev https://clerk.auth.videoremix.vip; img-src 'self' data: https: blob: https://clerk.auth.videoremix.vip; connect-src 'self' ws: wss: https://bzxohkrxcwodllketcpz.supabase.co https://*.videoremix.vip https://api.openai.com https://*.clerk.accounts.dev https://clerk.auth.videoremix.vip https://clerk-telemetry.com https://challenges.cloudflare.com https://*.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com https://*.cloudflare.com https://*.clerk.accounts.dev https://clerk.auth.videoremix.vip; media-src 'self' https: blob:; font-src 'self' https: data:; object-src 'none'; base-uri 'self'; form-action 'self';"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/_redirects"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
   for = "/assets/*.woff2"
   [headers.values]
     Cache-Control = "public, max-age=31536000, immutable"